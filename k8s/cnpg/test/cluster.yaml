# Minimal cluster used by .github/workflows/k8s-compat.yml on kind.
# The workflow substitutes IMAGE with a locally built image.
#
# One instance: community ParadeDB pg_search refuses physical standbys. The
# first bm25 index's WAL record (pg_search/INIT_INDEX) stops a replica with
# "replicas are not supported on community and require paradedb enterprise".
# See docs/kubernetes.md.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: compat
spec:
  instances: 1
  imageName: IMAGE
  imagePullPolicy: Never
  postgresUID: 999
  postgresGID: 999
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: app
      owner: app
      localeProvider: builtin
      builtinLocale: C.UTF-8
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_cron;
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS pg_search;
  postgresql:
    shared_preload_libraries:
      - pg_cron
      - pg_search
    parameters:
      shared_buffers: 128MB
      io_method: worker
      jit: "off"
      log_connections: setup_durations
      track_wal_io_timing: "on"
      track_cost_delay_timing: "on"
      pg_stat_statements.max: "1000"
      pgaudit.log: none
      cron.database_name: postgres
      cron.use_background_workers: "on"
