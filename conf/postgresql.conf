# EvilFlowers PostgreSQL - image defaults
#
# Conservative values that are safe on a 2 GB container. Size the memory and
# I/O settings for a real host in a drop-in file mounted into
# /etc/postgresql/conf.d/ (see compose/production/50-host.conf and docs/tuning.md).
#
# This file applies only when postgres starts with
#   -c config_file=/etc/postgresql/postgresql.conf
# which is the image CMD. CloudNativePG ignores it and takes parameters from
# the Cluster spec instead (k8s/cnpg/cluster.yaml).

#------------------------------------------------------------------------------
# Connections
#------------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 200            # apps should use a pooler (pgcat) where possible
superuser_reserved_connections = 5
password_encryption = scram-sha-256
idle_in_transaction_session_timeout = '15min'
tcp_keepalives_idle = 300

#------------------------------------------------------------------------------
# Memory (host overrides expected)
#------------------------------------------------------------------------------
shared_buffers = '512MB'
effective_cache_size = '1536MB'
work_mem = '8MB'
maintenance_work_mem = '256MB'   # pgvector HNSW builds want more; SET per session
autovacuum_work_mem = '128MB'
huge_pages = try
dynamic_shared_memory_type = posix   # needs a large /dev/shm: compose shm_size

#------------------------------------------------------------------------------
# Planner / I/O - assumes SSD-backed storage
#------------------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200
default_statistics_target = 100
jit = off                        # JIT rarely pays off for OLTP and short queries

#------------------------------------------------------------------------------
# Parallelism
#------------------------------------------------------------------------------
max_worker_processes = 16
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2   # also used by parallel HNSW builds

#------------------------------------------------------------------------------
# WAL / checkpoints
#------------------------------------------------------------------------------
wal_level = replica              # set to 'logical' for CDC (e.g. Debezium -> Kafka)
wal_compression = zstd
wal_buffers = -1
max_wal_size = '2GB'
min_wal_size = '512MB'
checkpoint_timeout = '15min'
checkpoint_completion_target = 0.9
max_wal_senders = 10
max_replication_slots = 10
archive_mode = off               # turn on together with pgBackRest

#------------------------------------------------------------------------------
# Autovacuum
#------------------------------------------------------------------------------
autovacuum_max_workers = 4
autovacuum_naptime = '30s'
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000

#------------------------------------------------------------------------------
# Logging (to stderr; docker / kubelet collect it)
#------------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d/%a '
log_min_duration_statement = '1s'
log_autovacuum_min_duration = '10s'
log_checkpoints = on
log_lock_waits = on
log_temp_files = '64MB'
log_connections = off            # 18+: 'setup_durations' in 00-version.conf
log_disconnections = off
log_timezone = 'UTC'

#------------------------------------------------------------------------------
# Statistics
#------------------------------------------------------------------------------
# Latency data for the exporter. See docs/tuning.md "Monitoring settings".
track_io_timing = on
track_wal_io_timing = on         # WAL write/fsync time (pg_stat_io in 18+)
track_activity_query_size = 4096 # full ORM queries in pg_stat_activity; restart only
track_functions = pl
compute_query_id = on
# 18+ only: track_cost_delay_timing in 00-version.conf

#------------------------------------------------------------------------------
# Preloaded extensions
#------------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements,auto_explain,pg_cron,pgaudit'

pg_stat_statements.max = 10000
pg_stat_statements.track = top
#pg_stat_statements.track_planning = off   # on = *_plan_time columns, noticeable overhead

auto_explain.log_min_duration = '5s'
auto_explain.log_analyze = off
auto_explain.log_format = 'text'

cron.database_name = 'postgres'  # jobs for other DBs: cron.schedule_in_database()
cron.use_background_workers = on

pgaudit.log = 'none'             # loaded but inactive; enable per role/db if needed

#------------------------------------------------------------------------------
# Locale defaults
#------------------------------------------------------------------------------
timezone = 'UTC'
lc_messages = 'C.UTF-8'
default_text_search_config = 'pg_catalog.english'   # same as upstream initdb

#------------------------------------------------------------------------------
# Drop-ins: version-specific defaults (00-version.conf), then host overrides.
#------------------------------------------------------------------------------
include_dir = '/etc/postgresql/conf.d'
