# PostgreSQL 17 specific defaults (copied to /etc/postgresql/conf.d/00-version.conf)
#
# 17 has no asynchronous I/O subsystem; nothing to override yet. This file
# exists so every supported major has an explicit drop-in.
#
# Do not copy the monitoring lines from 18.conf: 17 rejects the list syntax of
# log_connections and has no track_cost_delay_timing, so the server would not start.
