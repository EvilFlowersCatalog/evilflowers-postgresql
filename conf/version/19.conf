# PostgreSQL 19 specific defaults (copied to /etc/postgresql/conf.d/00-version.conf)
# Preview: mirror 18.conf until 19 is promoted to stable.

# Asynchronous I/O. Same io_method as 18, see 18.conf for why not io_uring.
io_method = worker
# 19 replaced the fixed io_workers pool with one that scales between
# io_min_workers and io_max_workers (default 8). The floor keeps 18's 3 workers.
io_min_workers = 3
