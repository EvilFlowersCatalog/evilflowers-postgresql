# PostgreSQL 18 specific defaults (copied to /etc/postgresql/conf.d/00-version.conf)

# Asynchronous I/O (new in 18). 'worker' runs everywhere. 'io_uring' is faster
# but needs liburing and is blocked by Docker's default seccomp profile and by
# many Kubernetes runtimes, so we do not use it.
io_method = worker
io_workers = 3

# Monitoring (new in 18). See docs/tuning.md "Monitoring settings".
# One log line per connection with total setup, fork and auth time:
# client-visible connection latency, without the receipt/auth noise of 'on'.
log_connections = 'setup_durations'
# Time vacuum spends in cost-based sleep, in pg_stat_progress_vacuum.
track_cost_delay_timing = on
