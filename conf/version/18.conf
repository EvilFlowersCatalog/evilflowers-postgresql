# PostgreSQL 18 specific defaults (copied to /etc/postgresql/conf.d/00-version.conf)

# Asynchronous I/O (new in 18). 'worker' runs everywhere. 'io_uring' is faster
# but needs liburing and is blocked by Docker's default seccomp profile and by
# many Kubernetes runtimes, so we do not use it.
io_method = worker
io_workers = 3
