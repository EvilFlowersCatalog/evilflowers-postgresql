# Host profile example (PostgreSQL 18)
#
# Mounted as /etc/postgresql/conf.d/50-host.conf; overrides conf/postgresql.conf.
# Copy it, then resize it for your host with docs/tuning.md.
#
# Sized for: a VM with 8 vCPU, 32 GiB RAM and SSD-backed storage, shared with
# other services, so PostgreSQL gets a 10 GiB budget (mem_limit in compose.yml).
# One cluster serves several applications; the busy ones connect through a
# transaction-mode pooler (pgcat / PgBouncer), the rest directly.
#
# Memory budget (10 GiB container limit):
#   shared_buffers 4 GiB + autovacuum 4 x 256 MiB + ~60 active backends x
#   (work_mem 16 MiB x a few sort/hash nodes) + maintenance 1 GiB stays below
#   the limit with headroom. Raise work_mem per role/session, not globally:
#     ALTER ROLE reporting SET work_mem = '128MB';

# Memory
shared_buffers = '4GB'
effective_cache_size = '12GB'      # what the planner may assume the OS page cache holds
work_mem = '16MB'
hash_mem_multiplier = 2.0
maintenance_work_mem = '1GB'       # pgvector HNSW builds: SET maintenance_work_mem = '4GB' per session
autovacuum_work_mem = '256MB'

# Connections (pooler server pools + direct clients + headroom)
max_connections = 200

# CPU
max_worker_processes = 16
max_parallel_workers = 6
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 4
io_workers = 3

# WAL / checkpoints
max_wal_size = '4GB'
min_wal_size = '1GB'
checkpoint_timeout = '15min'

# Autovacuum
autovacuum_max_workers = 4
autovacuum_vacuum_cost_limit = 2000
