name: build

# Trunk-based releases:
#   pull_request  -> lint, build and smoke-test every major on amd64 + arm64 (no push)
#   push to master  -> same, then publish multi-arch images, sign them and cut a GitHub release
#   schedule      -> weekly rebuild on the same base tags to pick up Debian security fixes
#   dispatch      -> manual rebuild (e.g. after an out-of-band PostgreSQL security release)

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: versions.json is valid
        run: jq -e '.default as $d | .majors[$d].status == "stable"' versions.json
      - name: hadolint
        run: docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" hadolint/hadolint:v2.15.1 < Dockerfile
      - name: shellcheck
        run: shellcheck tests/*.sh initdb/*.sh scripts/*.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  matrix:
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.m.outputs.builds }}
      majors: ${{ steps.m.outputs.majors }}
      stamp: ${{ steps.m.outputs.stamp }}
      image: ${{ steps.m.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: m
        run: |
          {
            echo "builds=$(jq -c '[.majors | to_entries[] | .key as $m | .value as $v
              | ({arch: "amd64", runner: "ubuntu-24.04"}, {arch: "arm64", runner: "ubuntu-24.04-arm"})
              | {major: $m, base: $v.base, status: $v.status, arch, runner}]' versions.json)"
            echo "majors=$(jq -c '[.majors | to_entries[] | {major: .key, status: .value.status}]' versions.json)"
            echo "stamp=$(date -u +%Y%m%d%H%M)"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.major }}/${{ matrix.arch }}
    needs: [lint, matrix]
    runs-on: ${{ matrix.runner }}   # native runners for both architectures, no QEMU
    continue-on-error: ${{ matrix.status == 'preview' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.builds) }}
    env:
      IMAGE: ${{ needs.matrix.outputs.image }}
      CACHE_SCOPE: pg${{ matrix.major }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read build arguments
        id: args
        run: |
          {
            echo "pgvector=$(jq -r .pgvector versions.json)"
            echo "extensions=$(jq -r '.extensions | join(" ")' versions.json)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (load for testing)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          sbom: false
          tags: evilflowers-postgresql:test
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            PGVECTOR_VERSION=${{ steps.args.outputs.pgvector }}
            EXTENSIONS=${{ steps.args.outputs.extensions }}
            VERSION=${{ matrix.major }}-${{ needs.matrix.outputs.stamp }}
            REVISION=${{ github.sha }}
            CREATED=${{ needs.matrix.outputs.stamp }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,scope=${{ env.CACHE_SCOPE }},mode=max

      - name: Smoke test
        run: tests/smoke.sh evilflowers-postgresql:test "${{ steps.args.outputs.pgvector }}"

      - name: Vulnerability scan (fail on fixable CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" image \
            --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 \
            evilflowers-postgresql:test
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" image \
            --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --format table \
            evilflowers-postgresql:test

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # must match the test build above so the layers come from cache
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            PGVECTOR_VERSION=${{ steps.args.outputs.pgvector }}
            EXTENSIONS=${{ steps.args.outputs.extensions }}
            VERSION=${{ matrix.major }}-${{ needs.matrix.outputs.stamp }}
            REVISION=${{ github.sha }}
            CREATED=${{ needs.matrix.outputs.stamp }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}

      - name: Export digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: digests-${{ matrix.major }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish ${{ matrix.major }}
    needs: [matrix, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.status == 'preview' }}
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing (Sigstore)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.majors) }}
    env:
      IMAGE: ${{ needs.matrix.outputs.image }}
      STAMP: ${{ needs.matrix.outputs.stamp }}
      MAJOR: ${{ matrix.major }}
      STATUS: ${{ matrix.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.major }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        id: manifest
        run: scripts/publish-manifest.sh "$RUNNER_TEMP/digests"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        run: cosign sign --yes "${IMAGE}@${{ steps.manifest.outputs.digest }}"

      - name: Record tags
        env:
          TAGS: ${{ steps.manifest.outputs.tags }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          printf '%s %s %s\n' "$STATUS" "$DIGEST" "$TAGS" > "$RUNNER_TEMP/published/${MAJOR}.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-${{ matrix.major }}
          path: ${{ runner.temp }}/published/${{ matrix.major }}.txt
          retention-days: 7

  release:
    needs: [matrix, publish]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: published-*
          path: ${{ runner.temp }}/published
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          STAMP: ${{ needs.matrix.outputs.stamp }}
          IMAGE: ${{ needs.matrix.outputs.image }}
          EVENT: ${{ github.event_name }}
        run: |
          scripts/release-notes.sh "$RUNNER_TEMP/published" > "$RUNNER_TEMP/notes.md"
          gh release create "r${STAMP}" --target "$GITHUB_SHA" --title "r${STAMP}" --notes-file "$RUNNER_TEMP/notes.md"
